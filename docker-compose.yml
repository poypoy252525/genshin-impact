services:
  backend:
    build: "./"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=genshin_db
      - POSTGRES_USER=genshin_user
      - POSTGRES_PASSWORD=genshin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genshin_user -d genshin_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/18/docker

  redis:
    image: redis:8-alpine

  celery:
    build: .
    command: celery -A config worker -l info
    depends_on:
      - redis

volumes:
  database:
